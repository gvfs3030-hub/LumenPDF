name: Build Lumen PDF for Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: python -m PyInstaller --noconfirm --clean --windowed --onefile --name LumenPDF --icon lumen.ico --collect-all pymupdf --collect-all fitz leitor_lumen.py

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: LumenPDF-Windows-x64
          path: dist/LumenPDF.exe
          if-no-files-found: error
